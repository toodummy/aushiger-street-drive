name: Deploy Aushiger to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - '*.bin'
      - 'ruslan.png'
      - 'cars/**'
      - 'textures/**'
      - 'models/**'
      - 'backgrounds/**'
      - 'vendor/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify game files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html ruslan.png app-v3.js style.css route.json street.part0.0.bin street.part0.1.bin street.part0.2.bin street.part1.0.bin street.part1.1.bin street.part1.2.bin street.part2.bin cars/lada-21074.glb cars/lada-kalina.glb cars/vw-polo.glb models/cow.glb backgrounds/aushiger-wide.jpg backgrounds/aushiger-tall.jpg vendor/three/LICENSE; do
            test -s "$file" || { echo "Missing game file: $file"; exit 1; }
          done
          find . -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html ruslan.png *.js *.css route.json street.part*.bin _site/
          cp -R cars textures models vendor backgrounds _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
